<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>LiveSlate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: broadcast-control-room scoreboard. Sticky league rail, "Best Game On" hero, dense game rows, full-screen game sheet. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#0f1729; --muted:#5b6578; --line:#d9dee8;
  --accent:#1f4fd8; --accent-ink:#ffffff; --live:#e2362f; --gold:#b97d0c; --gold-soft:#fff3d6; --win:#138a52;
  --shadow:0 1px 2px rgba(15,23,41,.06),0 8px 24px rgba(15,23,41,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --surface-2:#0f1727; --ink:#e9eef7; --muted:#8f9bb3; --line:#233049;
  --accent:#6d93ff; --accent-ink:#0b1220; --live:#ff5a4f; --gold:#f2b33d; --gold-soft:#2a2414; --win:#3fcf8e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --surface-2:#0f1727; --ink:#e9eef7; --muted:#8f9bb3; --line:#233049;
  --accent:#6d93ff; --accent-ink:#0b1220; --live:#ff5a4f; --gold:#f2b33d; --gold-soft:#2a2414; --win:#3fcf8e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font:800 28px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--live)}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;margin-inline:-16px;padding-inline:16px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font:600 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .cnt{font-size:12px;background:var(--live);color:#fff;border-radius:999px;padding:2px 6px;letter-spacing:0}

/* day + filter bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-block:14px 6px}
.day{display:flex;align-items:center;gap:4px}
.day button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.day .label{font:700 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;min-width:140px;text-align:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* today's slate summary */
.slate-in{margin-top:6px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:4px}
.slate-in .next{color:var(--muted)}
.slate-in .next b{color:var(--ink)}
.slate-in .cd{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12px}

/* best game on */
.best{margin-top:12px;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.best-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:linear-gradient(90deg,var(--gold-soft),transparent)}
.best-head h2{margin:0;font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.best-head h2::before{content:"";width:10px;height:10px;background:var(--gold);transform:rotate(45deg)}
.best-head .sub{font-size:12px;color:var(--muted)}
.best-main{display:grid;grid-template-columns:1fr auto;gap:14px;padding:6px 16px 16px;cursor:pointer;width:100%;text-align:left;border:0;background:transparent}
.best-teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.bt{display:flex;align-items:center;gap:10px;min-width:0}
.bt img{width:34px;height:34px;object-fit:contain}
.bt .nm{font:700 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bt .sc{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.bt.lose .nm,.bt.lose .sc{color:var(--muted)}
.meter{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring{--v:50;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center}
.ring>div{width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 28px/1 var(--f-display)}
.meter small{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--surface-2);border:1px solid var(--line)}
.tag.hot{background:color-mix(in srgb,var(--live) 14%,transparent);border-color:color-mix(in srgb,var(--live) 40%,transparent);color:var(--live)}
.best-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px dashed var(--line)}
.alsos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;padding:0 16px 16px}
.also{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;min-width:0}
.also .t{font:700 17px/1.1 var(--f-display);text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.also .d{font-size:12px;color:var(--muted)}
.also .s{font:800 22px/1 var(--f-display);color:var(--gold)}

/* list */
.group{margin-top:22px}
.group h3{margin:0 0 8px;font:700 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.games{display:flex;flex-direction:column;gap:8px}
.game{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;transition:transform .12s,border-color .12s}
.game:hover{border-color:var(--accent)}
.game:active{transform:scale(.995)}
.game.fav{border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.st{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;line-height:1.2}
.st .live{color:var(--live);font:700 13px/1 var(--f-display);letter-spacing:.1em;display:flex;align-items:center;gap:5px}
.st .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
.st .big{font:700 16px/1.1 var(--f-display);color:var(--ink);letter-spacing:.02em}
.rows{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row img{width:22px;height:22px;object-fit:contain;flex:none}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .rk{font-size:11px;color:var(--muted);font-weight:700}
.row .rec{font-size:12px;color:var(--muted);flex:none}
.row .poss{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.row .sc{margin-left:auto;font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums;padding-left:8px}
.row.lose .nm,.row.lose .sc{color:var(--muted)}
.sit{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ws{font:800 18px/1 var(--f-display);color:var(--gold);display:flex;flex-direction:column;align-items:center;min-width:34px}
.ws small{font:700 9px/1 var(--f-body);letter-spacing:.08em;color:var(--muted);margin-top:2px}
.tv{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{color:var(--gold);transform:scale(1.25)}100%{transform:scale(1)}}

.empty,.err{margin-top:30px;padding:28px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.err button,.empty button{margin-top:12px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700}
.skel{height:76px;border-radius:14px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}

/* watch chips */
.watch{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;text-decoration:none;color:var(--ink)}
.wchip em{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wchip.stream{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sheet-top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet-top .in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700}
.sheet .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.score{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.score-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.tm{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.tm img{width:56px;height:56px;object-fit:contain}
.tm .nm{font:700 20px/1.05 var(--f-display);text-transform:uppercase}
.tm .rec{font-size:12px;color:var(--muted)}
.tm .star{border:0;background:transparent;font-size:12px;color:var(--muted);padding:2px 6px;border-radius:6px}
.tm .star[aria-pressed="true"]{color:var(--gold);font-weight:700}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.big-sc{display:flex;align-items:center;gap:14px;font:800 52px/1 var(--f-display);font-variant-numeric:tabular-nums}
.big-sc .dim{color:var(--muted)}
.big-sc .dash{font-size:28px;color:var(--muted)}
.statusline{font:700 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.statusline.live{color:var(--live)}
.sitbox{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.sitbox b{font-family:var(--f-display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.bases{display:inline-grid;grid-template-columns:repeat(3,10px);gap:2px;transform:rotate(45deg);margin:0 10px 0 6px;vertical-align:middle}
.bases i{width:10px;height:10px;border:1.5px solid var(--muted)}
.bases i.on{background:var(--gold);border-color:var(--gold)}
.ls{overflow-x:auto;margin-top:12px}
.ls table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.ls th,.ls td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
.ls th{font-weight:600;color:var(--muted)}
.ls td:first-child,.ls th:first-child{text-align:left;font-weight:700}
.ls td:last-child{font-weight:800}
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h4{margin:0 0 10px;font:700 16px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.wp svg{display:block;width:100%;height:auto}
.wp .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font:700 16px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px;font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.plays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.drive{margin:14px 0 4px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px}
.drive img{width:20px;height:20px;object-fit:contain}
.drive b{font-family:var(--f-display);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.play{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:start}
.play .t{font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.play .x{font-size:14px;min-width:0;overflow-wrap:anywhere}
.play .x small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.play .s{font:700 15px/1.2 var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.play.scoring{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.play.scoring .s{color:var(--ink)}
.play.new{animation:newp 2.5s ease-out}
@keyframes newp{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700}
.tstats{display:flex;flex-direction:column;gap:12px}
.ts .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.ts .lbl span:nth-child(2){color:var(--muted);font-weight:600}
.ts .lbl b{font-variant-numeric:tabular-nums}
.ts .bars{display:flex;gap:4px;height:6px}
.ts .bars i{display:block;border-radius:3px;background:var(--line)}
.ts .bars i.a{background:var(--accent)}
.ts .bars i.h{background:var(--gold)}
.box{overflow-x:auto;margin-top:6px}
.box table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
.box th,.box td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.box th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.box td:first-child,.box th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.box tr.tot td{font-weight:800}
.box-team{margin:16px 0 4px;display:flex;align-items:center;gap:8px;font:700 18px/1 var(--f-display);text-transform:uppercase}
.box-team img{width:22px;height:22px;object-fit:contain}
.box-grp{margin:10px 0 2px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){
  .game{grid-template-columns:62px 1fr auto;gap:10px;padding:10px}
  .big-sc{font-size:42px;gap:10px}
  .tm img{width:44px;height:44px}
  .tm .nm{font-size:17px}
  .bt .nm{font-size:21px}
  .ring{width:66px;height:66px}.ring>div{width:52px;height:52px;font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand"><h1>Live<span>Slate</span></h1><small>by Digital AIM</small></div>
      <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Loading…</span></div>
    </div>
    <nav class="rail" id="rail" aria-label="Leagues"></nav>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <div class="day">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <div class="label" id="dayLabel">Today</div>
      <button id="nextDay" aria-label="Next day">›</button>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Filter games">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="in" aria-pressed="false">Live</button>
      <button data-f="pre" aria-pressed="false">Upcoming</button>
      <button data-f="post" aria-pressed="false">Final</button>
    </div>
  </div>
  <section id="slate" aria-live="polite"></section>
  <section id="best" aria-label="Best game on"></section>
  <section id="list" aria-live="polite"></section>
  <footer>Scores refresh automatically. Watch options vary by market, subscription and blackout rules.<br>LiveSlate · Digital AIM</footer>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Game details">
  <div class="sheet-top"><div class="in">
    <button class="back" id="back">‹ Scores</button>
    <div class="sync" id="dsync"><span class="dot"></span><span id="dsyncText"></span></div>
  </div></div>
  <div class="wrap" id="detail"></div>
</div>

<script>
"use strict";
const API = "https://site.api.espn.com/apis/site/v2/sports/";
// scale = what counts as "close" in that sport; plen = seconds per period
const LEAGUES = [
  {key:"nfl",  name:"NFL",  path:"football/nfl",                      sport:"football",   periods:4, plen:900,  scale:8},
  {key:"cfb",  name:"CFB",  path:"football/college-football",         sport:"football",   periods:4, plen:900,  scale:8, q:"groups=80&limit=300"},
  {key:"nba",  name:"NBA",  path:"basketball/nba",                    sport:"basketball", periods:4, plen:720,  scale:6},
  {key:"wnba", name:"WNBA", path:"basketball/wnba",                   sport:"basketball", periods:4, plen:600,  scale:6},
  {key:"cbb",  name:"CBB",  path:"basketball/mens-college-basketball", sport:"basketball", periods:2, plen:1200, scale:6, q:"groups=50&limit=300"},
  {key:"mlb",  name:"MLB",  path:"baseball/mlb",                      sport:"baseball",   periods:9, plen:0,    scale:1.5},
  {key:"nhl",  name:"NHL",  path:"hockey/nhl",                        sport:"hockey",     periods:3, plen:1200, scale:1},

  {key:"ucl",  name:"UCL",  path:"soccer/uefa.champions",             sport:"soccer",     periods:2, plen:0,    scale:1},

const LG = Object.fromEntries(LEAGUES.map(l => [l.key, l]));

// Network → where to stream it. Matched on the start of the network name.
const STREAM = [
  [/^abc$|^espn$|^espn2|^espnu|^espnews|^sec ?network|^secn|^acc ?network|^accn|^longhorn/i, "ESPN app", "https://www.espn.com/watch/"],
  [/^espn\+|^espn ?plus|^espn ?unlimited/i, "ESPN app", "https://www.espn.com/watch/"],
  [/^cbs$|^cbs ?sports|^paramount/i, "Paramount+", "https://www.paramountplus.com/"],
  [/^nbc$|^peacock|^usa ?net/i, "Peacock", "https://www.peacocktv.com/"],
  [/^fox$|^fs1|^fs2|^fox ?sports|^btn|^big ?ten/i, "Fox One", "https://www.foxone.com/"],
  [/^prime|^amazon/i, "Prime Video", "https://www.primevideo.com/"],
  [/^netflix/i, "Netflix", "https://www.netflix.com/"],
  [/^tnt|^tbs|^trutv|^hbo|^max$/i, "HBO Max", "https://www.hbomax.com/"],
  [/^nba ?tv|^nba league/i, "NBA League Pass", "https://www.nba.com/watch/league-pass-stream"],
  [/^nfl ?net|^nfl\+/i, "NFL+", "https://www.nfl.com/plus/"],
  [/^mlb ?net|^mlb\.tv|^mlb ?tv/i, "MLB.TV", "https://www.mlb.com/tv"],
  [/^nhl ?net/i, "NHL Network", "https://www.nhl.com/"],
  [/^apple|^mls ?season/i, "Apple TV", "https://tv.apple.com/"],
  [/^youtube/i, "YouTube", "https://www.youtube.com/"],
  [/^tele?mundo|^universo/i, "Peacock", "https://www.peacocktv.com/"],
];

const state = {
  league: loadPref("lg", "all"),
  filter: "all",
  dayOffset: 0,
  games: [],
  prev: {},
  updated: 0,
  loading: false,
  error: null,
  fav: new Set(loadPref("fav", [])),
  detail: null,     // {game, data, tab, scoringOnly, shown, seenPlays}
  dayKey: null,     // calendar day the app last loaded, used for midnight rollover
};
let boardTimer = null, detailTimer = null, firstLoad = true;

/* ---------- helpers ---------- */
function loadPref(k, d){ try{ const v = localStorage.getItem("liveslate." + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function savePref(k, v){ try{ localStorage.setItem("liveslate." + k, JSON.stringify(v)); }catch(e){} }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function dayDate(off){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() + off); return d; }
function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
function dayLabel(off){
  if (off === 0) return "Today"; if (off === -1) return "Yesterday"; if (off === 1) return "Tomorrow";
  return dayDate(off).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}
function timeStr(iso){ return new Date(iso).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}); }
function clockSec(c){ if (!c) return 0; const p = String(c).split(":").map(Number); return p.length === 2 ? p[0]*60 + p[1] : (p[0] || 0); }
function winPct(rec){ if (!rec) return .5; const p = rec.split("-").map(Number); const w = p[0]||0, l = p[1]||0, t = p[2]||0; const n = w+l+t; return n ? (w + t/2)/n : .5; }
async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function img(src, alt){ return src ? `<img src="${esc(src)}" alt="${esc(alt||"")}" loading="lazy" onerror="this.style.visibility='hidden'">` : `<img alt="" style="visibility:hidden">`; }

/* ---------- normalize ---------- */
function team(c){
  const t = c.team || {};
  const rk = c.curatedRank?.current;
  return {
    id: t.id, abbr: t.abbreviation || "", name: t.shortDisplayName || t.name || t.displayName || "TBD",
    full: t.displayName || t.name || "", logo: t.logo || t.logos?.[0]?.href || "",
    color: t.color ? "#" + t.color : null,
    score: c.score != null && c.score !== "" ? Number(typeof c.score === "object" ? c.score.value : c.score) : null,
    record: c.records?.[0]?.summary || c.record?.[0]?.summary || "",
    rank: rk && rk <= 25 ? rk : null, winner: !!c.winner,
    lines: (c.linescores || []).map(x => x.displayValue ?? x.value),
  };
}
function broadcastsOf(c){
  const out = [], seen = new Set();
  (c.geoBroadcasts || []).forEach(b => {
    const name = b.media?.shortName; if (!name || seen.has(name)) return;
    if (/radio/i.test(b.type?.shortName || "")) return;   // skip radio feeds (e.g. ESPN Radio "ERADM")
    seen.add(name);
    out.push({name, type: b.type?.shortName || "TV", market: b.market?.type || "National"});
  });
  if (!out.length) (c.broadcasts || []).forEach(b => (b.names || []).forEach(n => {
    if (seen.has(n)) return; seen.add(n);
    out.push({name:n, type:"TV", market: b.market === "national" ? "National" : (b.market || "National")});
  }));
  return out;
}
function norm(ev, lg){
  const c = ev.competitions?.[0] || {};
  const cs = c.competitors || [];
  const hc = cs.find(x => x.homeAway === "home") || cs[0] || {};
  const ac = cs.find(x => x.homeAway === "away") || cs[1] || {};
  const st = c.status || ev.status || {};
  const o = c.odds?.[0];
  return {
    id: ev.id, lg, date: ev.date, name: ev.shortName || ev.name,
    home: team(hc), away: team(ac),
    state: st.type?.state || "pre", detail: st.type?.shortDetail || st.type?.detail || "",
    longDetail: st.type?.detail || "", period: st.period || 0, clock: st.displayClock || "",
    completed: !!st.type?.completed,
    broadcasts: broadcastsOf(c),
    odds: o ? {details:o.details, spread: o.spread != null ? Number(o.spread) : null,
      homeFav: o.homeTeamOdds?.favorite ?? (o.spread != null ? Number(o.spread) < 0 : null), ou:o.overUnder} : null,
    sit: c.situation || null,
    note: c.notes?.[0]?.headline || "",
    venue: c.venue?.fullName || "",
    neutral: !!c.neutralSite,
  };
}

/* ---------- Best Game On scoring ---------- */
function progress(g){
  const L = g.lg, p = g.period || 0;
  if (g.state === "post") return 1;
  if (g.state !== "in") return 0;
  if (L.sport === "baseball"){ const half = /^(bot|end)/i.test(g.detail) ? .5 : 0; return clamp((p - 1 + half) / 9); }
  if (L.sport === "soccer"){ const m = parseInt(g.clock) || (p - 1) * 45; return clamp(m / 90); }
  if (p > L.periods) return 1;
  const within = L.plen ? clamp(1 - clockSec(g.clock) / L.plen) : .5;
  return clamp((p - 1 + within) / L.periods);
}
const CLOSE_LABEL = {football:"One-score game", basketball:"Single-digit game", baseball:"One-run game", hockey:"One-goal game", soccer:"One-goal game"};
function watchScore(g){
  const L = g.lg, why = [];
  let s = 0;
  const favHit = state.fav.has(g.lg.key + ":" + g.home.id) || state.fav.has(g.lg.key + ":" + g.away.id);
  const ranked = (g.home.rank ? 1 : 0) + (g.away.rank ? 1 : 0);
  if (g.state === "in"){
    const margin = Math.abs((g.home.score || 0) - (g.away.score || 0));
    const prog = progress(g);
    s += clamp(1 - margin / (L.scale * 2.2)) * 45;
    s += prog * 20;
    const close = margin <= L.scale;
    if (margin === 0) why.push({t:"Tied", hot:true});
    if (prog >= .75 && close){ s += 20; why.push({t:"Crunch time", hot:true}); }
    else if (close && margin > 0) why.push({t:CLOSE_LABEL[L.sport]});
    if (g.period > L.periods && L.sport !== "baseball"){ s += 15; why.push({t: L.sport === "soccer" ? "Extra time" : "Overtime", hot:true}); }
    if (L.sport === "baseball" && g.period > 9){ s += 15; why.push({t:"Extra innings", hot:true}); }
    if (g.odds && g.odds.homeFav != null && margin > 0){
      const favScore = g.odds.homeFav ? g.home.score : g.away.score, dogScore = g.odds.homeFav ? g.away.score : g.home.score;
      if (dogScore > favScore){ s += 8; why.push({t:"Upset alert", hot:true}); }
    }
    if (g.sit?.isRedZone){ s += 5; why.push({t:"Red zone"}); }
    if (L.sport === "baseball" && (g.sit?.onSecond || g.sit?.onThird) && prog > .6){ s += 5; why.push({t:"Runners in scoring position"}); }
  } else if (g.state === "pre"){
    const sp = g.odds?.spread != null ? Math.abs(g.odds.spread) : L.scale;
    s += clamp(1 - sp / (L.scale * 1.6)) * 32;
    if (g.odds?.spread != null && sp <= L.scale * .4) why.push({t:"Coin-flip line"});
    const wa = winPct(g.away.record), wh = winPct(g.home.record);
    s += ((wa + wh) / 2) * 18;
    if (wa >= .6 && wh >= .6) why.push({t:"Two winning teams"});
    if (g.broadcasts.some(b => /national/i.test(b.market))){ s += 5; }
    const mins = (new Date(g.date) - Date.now()) / 60000;
    if (mins >= 0 && mins <= 60){ s += 10; why.push({t:`Starts in ${Math.max(1, Math.round(mins))} min`, hot:true}); }
    s = Math.min(s, 80);
  } else {
    const margin = Math.abs((g.home.score || 0) - (g.away.score || 0));
    if (margin <= L.scale * .5 || g.period > L.periods) why.push({t:"Instant classic"});
  }
  if (ranked){ s += ranked * 4; why.push({t: ranked === 2 ? "Top 25 vs Top 25" : "Ranked team"}); }
  if (g.note && /final|playoff|championship|semifinal|bowl|series|game \d/i.test(g.note)){ s += 10; why.push({t:g.note, hot:true}); }
  if (favHit){ s += 10; why.push({t:"Your team"}); }
  return {score: Math.round(clamp(s, 0, 99)), why};
}

/* ---------- where to watch ---------- */
function watchList(bs){
  const out = [];
  bs.forEach(b => {
    const m = STREAM.find(([re]) => re.test(b.name.trim()));
    const local = /home|away|local/i.test(b.market);
    out.push({label:b.name, kind: local ? "Local" : (/stream/i.test(b.type) ? "Stream" : "TV"), href: m && /stream/i.test(b.type) ? m[2] : null});
    if (m && !/stream/i.test(b.type) && !out.some(x => x.label === m[1])) out.push({label:m[1], kind:"Stream", href:m[2]});
  });
  return out;
}
function watchChips(bs, max){
  const w = watchList(bs).slice(0, max || 99);
  if (!w.length) return `<span class="hint">No broadcast listed yet</span>`;
  return w.map(x => x.href
    ? `<a class="wchip stream" href="${esc(x.href)}" target="_blank" rel="noopener"><em>${esc(x.kind)}</em>${esc(x.label)}</a>`
    : `<span class="wchip"><em>${esc(x.kind)}</em>${esc(x.label)}</span>`).join("");
}

/* ---------- scoreboard loading ---------- */
function activeLeagues(){ return state.league === "all" ? LEAGUES : [LG[state.league]]; }
function sbUrl(l){ return `${API}${l.path}/scoreboard?dates=${ymd(dayDate(state.dayOffset))}${l.q ? "&" + l.q : ""}`; }

async function loadBoard(){
  clearTimeout(boardTimer);
  state.loading = true; renderSync();
  if (firstLoad) renderSkeleton();
  const lgs = activeLeagues();
  const res = await Promise.allSettled(lgs.map(l => getJSON(sbUrl(l))));
  const games = [];
  let ok = 0;
  res.forEach((r, i) => {
    if (r.status !== "fulfilled") return; ok++;
    (r.value.events || []).forEach(ev => { try { games.push(norm(ev, lgs[i])); } catch(e){} });
  });
  state.loading = false;
  state.dayKey = ymd(dayDate(0));
  if (!ok){ state.error = "Couldn't reach the live score feed. If you opened this inside an app's file preview, open it in Safari or Chrome instead (previews block live data). Otherwise check your connection."; }
  else {
    state.error = null;
    games.forEach(g => {
      const p = state.prev[g.id];
      g.flash = p ? {h: p.h !== g.home.score, a: p.a !== g.away.score} : {h:false, a:false};
      state.prev[g.id] = {h:g.home.score, a:g.away.score};
      g.ws = watchScore(g);
    });
    state.games = games;
    state.updated = Date.now();
  }
  firstLoad = false;
  render();
  if (state.detail){
    const fresh = state.games.find(x => x.id === state.detail.game.id);
    if (fresh){ state.detail.game = fresh; renderDetailHead(); }
  }
  if (!document.hidden) boardTimer = setTimeout(loadBoard, nextPollMs());
}
// Poll fast while games are live, and wake up right at the next start time so games flip to LIVE on their own.
function nextPollMs(){
  if (state.games.some(g => g.state === "in")) return 20000;
  const now = Date.now();
  const starts = state.games.filter(g => g.state === "pre").map(g => new Date(g.date) - now);
  const soon = starts.filter(ms => ms > -15*60000).sort((a, b) => a - b)[0];
  if (soon != null && soon < 10*60000) return 20000;           // starting within 10 min (or just past start)
  if (soon != null && soon < 60*60000) return 60000;
  return 120000;
}
// New calendar day: jump back to today's slate and start fresh.
function checkRollover(){
  const today = ymd(dayDate(0));
  if (state.dayKey && today !== state.dayKey){
    state.dayOffset = 0; state.games = []; state.prev = {}; state.filter = "all"; firstLoad = true;
    render(); loadBoard();
  }
}
function untilStr(ms){
  const m = Math.round(ms / 60000);
  if (m <= 0) return "starting now";
  if (m < 60) return `in ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `in ${h}h${r ? " " + r + "m" : ""}`;
}
function renderSlate(){
  const el = $("slate"); if (!el) return;
  if (!state.games.length || state.error){ el.innerHTML = ""; return; }
  const live = state.games.filter(g => g.state === "in").length;
  const pre = state.games.filter(g => g.state === "pre").sort((a, b) => new Date(a.date) - new Date(b.date));
  const fin = state.games.filter(g => g.state === "post").length;
  const parts = [`<b>${state.games.length}</b> game${state.games.length === 1 ? "" : "s"}`];
  if (live) parts.push(`<b style="color:var(--live)">${live} live</b>`);
  if (pre.length) parts.push(`${pre.length} upcoming`);
  if (fin) parts.push(`${fin} final`);
  let next = "";
  if (!live && pre.length && state.dayOffset === 0){
    const n = pre[0];
    next = `<div class="next">Next up: <b>${esc(n.away.abbr || n.away.name)} at ${esc(n.home.abbr || n.home.name)}</b> · ${esc(n.lg.name)} · ${esc(timeStr(n.date))} <span class="cd">${esc(untilStr(new Date(n.date) - Date.now()))}</span></div>`;
  }
  el.innerHTML = `<div class="slate-in"><div>${dayLabel(state.dayOffset)}: ${parts.join(" · ")}</div>${next}</div>`;
}

/* ---------- render: rail, sync, list ---------- */
function renderRail(){
  const liveBy = {};
  state.games.forEach(g => { if (g.state === "in") liveBy[g.lg.key] = (liveBy[g.lg.key] || 0) + 1; });
  const totalLive = Object.values(liveBy).reduce((a,b) => a+b, 0);
  const items = [{key:"all", name:"All"}].concat(LEAGUES);
  $("rail").innerHTML = items.map(l => {
    const n = l.key === "all" ? totalLive : (state.league === "all" ? liveBy[l.key] : (state.league === l.key ? totalLive : 0));
    return `<button class="chip" data-lg="${l.key}" aria-pressed="${state.league === l.key}">${esc(l.name)}${n ? `<span class="cnt">${n}</span>` : ""}</button>`;
  }).join("");
}
function ago(t){ if (!t) return ""; const s = Math.round((Date.now() - t)/1000); return s < 5 ? "just now" : s < 60 ? s + "s ago" : Math.round(s/60) + "m ago"; }
function renderSync(){
  const live = state.games.some(g => g.state === "in");
  $("sync").classList.toggle("on", live);
  $("syncText").textContent = state.loading && !state.updated ? "Loading…" : live ? `Live · updated ${ago(state.updated)}` : state.updated ? `Updated ${ago(state.updated)}` : "";
}
function renderSkeleton(){
  $("best").innerHTML = "";
  $("list").innerHTML = `<div class="games" style="margin-top:16px">${'<div class="skel"></div>'.repeat(5)}</div>`;
}
function isFavGame(g){ return state.fav.has(g.lg.key + ":" + g.home.id) || state.fav.has(g.lg.key + ":" + g.away.id); }
function sortGames(a, b){
  const fa = isFavGame(a), fb = isFavGame(b); if (fa !== fb) return fa ? -1 : 1;
  const ord = {in:0, pre:1, post:2}; if (a.state !== b.state) return ord[a.state] - ord[b.state];
  if (a.state === "in") return b.ws.score - a.ws.score;
  return new Date(a.date) - new Date(b.date);
}
function statusCell(g){
  if (g.state === "in") return `<span class="live">LIVE</span><span class="big">${esc(g.detail)}</span>`;
  if (g.state === "post") return `<span class="big">${esc(g.detail || "Final")}</span>`;
  if (/postponed|canceled|delayed|suspended/i.test(g.longDetail)) return `<span class="big">${esc(g.detail)}</span>`;
  return `<span class="big">${esc(timeStr(g.date))}</span>${g.odds?.details ? `<span>${esc(g.odds.details)}</span>` : ""}`;
}
function sitLine(g){
  const s = g.sit; if (!s || g.state !== "in") return "";
  if (g.lg.sport === "football" && s.downDistanceText) return s.downDistanceText;
  if (g.lg.sport === "baseball"){
    const parts = [];
    if (s.outs != null) parts.push(`${s.outs} out${s.outs === 1 ? "" : "s"}`);
    if (s.balls != null && s.strikes != null) parts.push(`${s.balls}-${s.strikes}`);
    const on = ["onFirst","onSecond","onThird"].filter(k => s[k]).length;
    if (on) parts.push(on === 3 ? "Bases loaded" : `${on} on`);
    return parts.join(" · ");
  }
  return s.lastPlay?.text || "";
}
function teamRow(t, g, side){
  const lose = g.state === "post" && !t.winner && (g.home.winner || g.away.winner);
  const poss = g.sit?.possession && g.sit.possession === t.id && g.state === "in";
  const flash = g.flash?.[side] ? " flash" : "";
  return `<div class="row${lose ? " lose" : ""}">${img(t.logo)}${t.rank ? `<span class="rk">${t.rank}</span>` : ""}<span class="nm">${esc(t.name)}</span>${poss ? `<span class="poss" title="Possession"></span>` : ""}<span class="rec">${esc(t.record)}</span><span class="sc${flash}">${g.state === "pre" || t.score == null ? "" : t.score}</span></div>`;
}
function gameCard(g){
  const tv = watchList(g.broadcasts)[0];
  const sit = sitLine(g);
  const showWs = g.state !== "post";
  return `<button class="game${isFavGame(g) ? " fav" : ""}" data-id="${esc(g.id)}" aria-label="${esc(g.away.full)} at ${esc(g.home.full)}">
    <div class="st">${statusCell(g)}</div>
    <div class="rows">${teamRow(g.away, g, "a")}${teamRow(g.home, g, "h")}${sit ? `<div class="sit">${esc(sit)}</div>` : ""}</div>
    <div class="side">${showWs ? `<div class="ws" title="Watch Score">${g.ws.score}<small>WATCH</small></div>` : ""}${tv ? `<span class="tv">${esc(tv.label)}</span>` : ""}</div>
  </button>`;
}
function renderBest(){
  const live = state.games.filter(g => g.state === "in").sort((a,b) => b.ws.score - a.ws.score);
  const pre = state.games.filter(g => g.state === "pre").sort((a,b) => (b.ws.score - a.ws.score) || (new Date(a.date) - new Date(b.date)));
  const pool = live.length ? live : pre;
  if (!pool.length || state.filter === "post"){ $("best").innerHTML = ""; return; }
  const g = pool[0], rest = pool.slice(1, 3);
  const isLive = g.state === "in";
  const bt = (t, side) => {
    const lose = isLive && t.score < (side === "h" ? g.away.score : g.home.score);
    return `<div class="bt${lose ? " lose" : ""}">${img(t.logo)}<span class="nm">${t.rank ? `<small class="rk">${t.rank} </small>` : ""}${esc(t.name)}</span><span class="sc${g.flash?.[side] ? " flash" : ""}">${isLive ? t.score : ""}</span></div>`;
  };
  $("best").innerHTML = `<div class="best">
    <div class="best-head"><h2>${isLive ? "Best Game On" : "Best Game Up Next"}</h2><span class="sub">${esc(g.lg.name)} · ${isLive ? `<b style="color:var(--live)">${esc(g.detail)}</b>` : esc(timeStr(g.date)) + " · " + esc(untilStr(new Date(g.date) - Date.now()))}</span></div>
    <button class="best-main" data-id="${esc(g.id)}">
      <div class="best-teams">${bt(g.away, "a")}${bt(g.home, "h")}${sitLine(g) ? `<div class="sit">${esc(sitLine(g))}</div>` : ""}</div>
      <div class="meter"><div class="ring" style="--v:${g.ws.score}"><div>${g.ws.score}</div></div><small>Watch Score</small></div>
    </button>
    ${g.ws.why.length ? `<div class="why">${g.ws.why.map(w => `<span class="tag${w.hot ? " hot" : ""}">${esc(w.t)}</span>`).join("")}</div>` : ""}
    <div class="best-foot"><div class="watch">${watchChips(g.broadcasts, 4)}</div></div>
    ${rest.length ? `<div class="alsos">${rest.map(r => `<button class="also" data-id="${esc(r.id)}"><div style="min-width:0"><div class="t">${esc(r.away.abbr || r.away.name)} ${r.state === "in" ? r.away.score + "–" + r.home.score : "vs"} ${esc(r.home.abbr || r.home.name)}</div><div class="d">${esc(r.lg.name)} · ${esc(r.state === "in" ? r.detail : timeStr(r.date))}${watchList(r.broadcasts)[0] ? " · " + esc(watchList(r.broadcasts)[0].label) : ""}</div></div><div class="s">${r.ws.score}</div></button>`).join("")}</div>` : ""}
  </div>`;
}
function render(){
  renderRail(); renderSync();
  $("dayLabel").textContent = dayLabel(state.dayOffset);
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === state.filter));
  if (state.error && !state.games.length){
    $("best").innerHTML = ""; renderSlate();
    $("list").innerHTML = `<div class="err">${esc(state.error)}<br><button id="retry">Try again</button></div>`;
    return;
  }
  renderSlate();
  renderBest();
  const games = state.games.filter(g => state.filter === "all" || g.state === state.filter).sort(sortGames);
  if (!games.length){
    const what = {all:"games", in:"live games right now", pre:"upcoming games", post:"final scores"}[state.filter];
    $("list").innerHTML = `<div class="empty">No ${what} ${state.dayOffset === 0 ? "today" : "on " + dayLabel(state.dayOffset)}${state.league !== "all" ? " in the " + LG[state.league].name : ""}.${state.filter !== "all" ? `<br><button data-setfilter="all">Show all games</button>` : ""}</div>`;
    return;
  }
  let html = "";
  const groups = state.league === "all" ? LEAGUES.map(l => [l, games.filter(g => g.lg.key === l.key)]).filter(x => x[1].length) : [[LG[state.league], games]];
  groups.forEach(([l, gs]) => { html += `<div class="group"><h3>${esc(l.name)}</h3><div class="games">${gs.map(gameCard).join("")}</div></div>`; });
  $("list").innerHTML = html;
}

/* ---------- detail ---------- */
function openGame(id){
  const g = state.games.find(x => x.id === id); if (!g) return;
  state.detail = {game:g, data:null, tab:"plays", scoringOnly:false, shown:150, seen:null, err:null};
  $("sheet").hidden = false; document.body.style.overflow = "hidden";
  $("sheet").scrollTop = 0;
  renderDetail(); loadDetail();
}
function closeGame(){
  clearTimeout(detailTimer); state.detail = null;
  $("sheet").hidden = true; document.body.style.overflow = "";
}
async function loadDetail(){
  clearTimeout(detailTimer);
  const d = state.detail; if (!d) return;
  try {
    const data = await getJSON(`${API}${d.game.lg.path}/summary?event=${d.game.id}`);
    if (state.detail !== d) return;
    d.data = data; d.err = null; d.updated = Date.now();
    mergeHeader(d);
  } catch(e){ if (state.detail === d) d.err = "Couldn't load game details. Retrying shortly."; }
  if (state.detail !== d) return;
  renderDetail();
  const live = d.game.state === "in";
  const soon = d.game.state === "pre" && new Date(d.game.date) - Date.now() < 30*60000;
  if (!document.hidden && (live || soon || d.err)) detailTimer = setTimeout(loadDetail, live ? 10000 : 30000);
}
function mergeHeader(d){
  const comp = d.data?.header?.competitions?.[0]; if (!comp) return;
  const g = d.game;
  const st = comp.status;
  if (st?.type){ g.state = st.type.state; g.detail = st.type.shortDetail || g.detail; g.longDetail = st.type.detail || g.longDetail; g.period = st.period ?? g.period; g.clock = st.displayClock ?? g.clock; }
  (comp.competitors || []).forEach(c => {
    const t = c.homeAway === "home" ? g.home : g.away;
    if (c.score != null && c.score !== "") t.score = Number(c.score);
    if (c.linescores) t.lines = c.linescores.map(x => x.displayValue ?? x.value);
    if (c.winner != null) t.winner = !!c.winner;
    if (c.record?.[0]?.summary && !t.record) t.record = c.record[0].summary;
  });
  if (d.data.situation) g.sit = Object.assign({}, g.sit || {}, d.data.situation);
  if (!g.broadcasts.length && d.data.broadcasts){
    g.broadcasts = d.data.broadcasts.map(b => ({name: b.media?.shortName || b.station || "", type: b.type?.shortName || "TV", market: b.market?.type || "National"})).filter(b => b.name);
  }
  g.ws = watchScore(g);
}
function favBtn(g, t){
  const k = g.lg.key + ":" + t.id, on = state.fav.has(k);
  return `<button class="star" data-fav="${esc(k)}" aria-pressed="${on}">${on ? "★ My team" : "☆ Follow"}</button>`;
}
function renderDetailHead(){
  const d = state.detail; if (!d) return;
  const el = $("dhead"); if (el) el.outerHTML = detailHeadHTML(d.game);
  const live = d.game.state === "in";
  $("dsync").classList.toggle("on", live);
  $("dsyncText").textContent = live ? `Live · ${ago(d.updated || state.updated)}` : d.updated ? `Updated ${ago(d.updated)}` : "";
}
function detailHeadHTML(g){
  const live = g.state === "in", pre = g.state === "pre";
  const aLose = g.state === "post" && g.home.winner, hLose = g.state === "post" && g.away.winner;
  const statusTxt = pre ? new Date(g.date).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : g.longDetail || g.detail;
  // situation
  let sit = "";
  const s = g.sit;
  if (live && s){
    if (g.lg.sport === "football" && (s.downDistanceText || s.lastPlay)){
      const pt = s.possession ? (s.possession === g.home.id ? g.home.abbr : g.away.abbr) : "";
      sit = `<div class="sitbox">${s.downDistanceText ? `<b>${esc(s.downDistanceText)}</b>${pt ? ` · ${esc(pt)} ball` : ""}${s.isRedZone ? ` · <span style="color:var(--live);font-weight:700">Red zone</span>` : ""}` : ""}${s.lastPlay?.text ? `<div class="hint" style="margin-top:4px">Last play: ${esc(s.lastPlay.text)}</div>` : ""}</div>`;
    } else if (g.lg.sport === "baseball"){
      sit = `<div class="sitbox"><span class="bases"><i class="${s.onSecond ? "on" : ""}"></i><i class="${s.onFirst ? "on" : ""}"></i><i class="${s.onThird ? "on" : ""}"></i></span><b>${s.balls ?? 0}-${s.strikes ?? 0}, ${s.outs ?? 0} out${s.outs === 1 ? "" : "s"}</b>${s.batter?.athlete?.shortName ? ` · AB: ${esc(s.batter.athlete.shortName)}` : ""}${s.pitcher?.athlete?.shortName ? ` · P: ${esc(s.pitcher.athlete.shortName)}` : ""}${s.lastPlay?.text ? `<div class="hint" style="margin-top:4px">Last play: ${esc(s.lastPlay.text)}</div>` : ""}</div>`;
    } else if (s.lastPlay?.text){
      sit = `<div class="sitbox"><span class="hint" style="margin:0">Last play:</span> ${esc(s.lastPlay.text)}</div>`;
    }
  }
  // linescore
  let ls = "";
  const n = Math.max(g.away.lines.length, g.home.lines.length);
  if (n && !pre){
    const L = g.lg;
    const lab = i => L.sport === "soccer" ? (i < 2 ? (i ? "2H" : "1H") : "ET") : (i < L.periods ? String(i + 1) : (L.sport === "baseball" ? String(i + 1) : (L.sport === "hockey" && i > 3 ? "SO" : "OT")));
    ls = `<div class="ls"><table><thead><tr><th></th>${Array.from({length:n}, (_, i) => `<th>${lab(i)}</th>`).join("")}<th>T</th></tr></thead><tbody>
      ${[g.away, g.home].map(t => `<tr><td>${esc(t.abbr || t.name)}</td>${Array.from({length:n}, (_, i) => `<td>${esc(t.lines[i] ?? "")}</td>`).join("")}<td>${t.score ?? ""}</td></tr>`).join("")}
    </tbody></table></div>`;
  }
  return `<div id="dhead">
    <div class="score">
      <div class="score-grid">
        <div class="tm">${img(g.away.logo)}<div class="nm">${g.away.rank ? g.away.rank + " " : ""}${esc(g.away.name)}</div><div class="rec">${esc(g.away.record)}${g.away.record ? " · " : ""}Away</div>${favBtn(g, g.away)}</div>
        <div class="mid">
          <div class="big-sc">${pre ? `<span class="dash">VS</span>` : `<span class="${aLose ? "dim" : ""}">${g.away.score ?? 0}</span><span class="dash">–</span><span class="${hLose ? "dim" : ""}">${g.home.score ?? 0}</span>`}</div>
          <div class="statusline${live ? " live" : ""}">${esc(statusTxt)}</div>
          ${pre && g.odds?.details ? `<div class="hint" style="margin:0">${esc(g.odds.details)}${g.odds.ou ? " · O/U " + esc(g.odds.ou) : ""}</div>` : ""}
        </div>
        <div class="tm">${img(g.home.logo)}<div class="nm">${g.home.rank ? g.home.rank + " " : ""}${esc(g.home.name)}</div><div class="rec">${esc(g.home.record)}${g.home.record ? " · " : ""}${g.neutral ? "Neutral" : "Home"}</div>${favBtn(g, g.home)}</div>
      </div>
      ${sit}${ls}
    </div>
    <div class="panel"><h4>Where to watch</h4><div class="watch">${watchChips(g.broadcasts)}</div>
      <div class="hint">${g.venue ? esc(g.venue) + " · " : ""}Local broadcasts and blackouts depend on where you live.</div></div>
    ${g.state !== "post" ? `<div class="panel"><h4>Watch Score · ${g.ws.score}</h4><div class="why" style="padding:0">${g.ws.why.length ? g.ws.why.map(w => `<span class="tag${w.hot ? " hot" : ""}">${esc(w.t)}</span>`).join("") : `<span class="hint" style="margin:0">Nothing special yet. Check back as it tightens up.</span>`}</div></div>` : ""}
  </div>`;
}
function wpChart(d){
  const wp = d.data?.winprobability; if (!wp || wp.length < 3) return "";
  const g = d.game, W = 600, H = 140, pad = 6;
  const pts = wp.map((p, i) => [pad + i * (W - 2*pad) / (wp.length - 1), pad + (1 - (p.homeWinPercentage ?? .5)) * (H - 2*pad)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const mid = H / 2;
  const area = `M${pad} ${mid} ` + pts.map(p => "L" + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") + ` L${(W - pad)} ${mid} Z`;
  const last = wp[wp.length - 1].homeWinPercentage ?? .5;
  const lead = last >= .5 ? g.home : g.away, pct = Math.round((last >= .5 ? last : 1 - last) * 100);
  const end = pts[pts.length - 1];
  return `<div class="panel wp"><h4>Win probability</h4>
    <div class="lab"><span>${esc(lead.abbr || lead.name)} ${pct}%</span><span class="hint" style="margin:0">${esc(g.home.abbr)} above · ${esc(g.away.abbr)} below</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Win probability over the game">
      <line x1="${pad}" x2="${W-pad}" y1="${mid}" y2="${mid}" stroke="var(--line)" stroke-dasharray="4 4"/>
      <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="4.5" fill="var(--gold)"/>
    </svg></div>`;
}
function extractPlays(d){
  const data = d.data || {}, g = d.game, out = [];
  const per = p => p?.displayValue || (p?.number ? (g.lg.sport === "hockey" ? "P" : g.lg.sport === "baseball" ? "Inn " : "Q") + p.number : "");
  if (data.drives && (data.drives.previous || data.drives.current)){
    const drives = [...(data.drives.previous || [])];
    const cur = data.drives.current;
    if (cur && !drives.some(x => x.id === cur.id)) drives.push(cur);
    drives.forEach((dr, di) => {
      const drv = {team: dr.team, desc: dr.description || "", result: dr.displayResult || dr.result || "", idx: di, live: cur && dr.id === cur.id && g.state === "in"};
      (dr.plays || []).forEach(p => out.push({id: p.id || (di + "-" + out.length), text: p.text, when: [per(p.period), p.clock?.displayValue].filter(Boolean).join(" "),
        meta: p.start?.downDistanceText || "", a: p.awayScore, h: p.homeScore, scoring: !!p.scoringPlay, drive: drv}));
    });
  } else if (data.plays?.length){
    data.plays.forEach((p, i) => { if (!p.text) return; out.push({id: p.id || i, text: p.text, when: [per(p.period), g.lg.sport === "baseball" ? "" : p.clock?.displayValue].filter(Boolean).join(" "),
      meta: g.lg.sport === "baseball" ? "" : (p.type?.text && !/^(play|jumpball)$/i.test(p.type.text) ? "" : ""), a: p.awayScore, h: p.homeScore, scoring: !!p.scoringPlay}); });
  } else if (data.commentary?.length){
    data.commentary.forEach((p, i) => { if (!p.text) return; out.push({id: p.sequence ?? i, text: p.text, when: p.time?.displayValue || "", a: null, h: null, scoring: !!p.play?.scoringPlay}); });
  } else if (data.keyEvents?.length){
    data.keyEvents.forEach((p, i) => { out.push({id: p.id || i, text: p.text || p.type?.text, when: p.clock?.displayValue || "", meta: p.type?.text || "", a: null, h: null, scoring: !!p.scoringPlay}); });
  } else if (data.scoringPlays?.length){
    data.scoringPlays.forEach((p, i) => out.push({id: p.id || i, text: p.text, when: [per(p.period), p.clock?.displayValue].filter(Boolean).join(" "), a: p.awayScore, h: p.homeScore, scoring: true}));
  }
  return out.reverse(); // newest first
}
function playsHTML(d){
  const all = extractPlays(d);
  if (!all.length) return `<div class="empty" style="margin-top:14px">${d.game.state === "pre" ? "Play-by-play starts at tip-off / kickoff. This page updates on its own." : d.data ? "No play-by-play published for this game." : "Loading plays…"}</div>`;
  const prevSeen = d.seen; const nowSeen = new Set(all.map(p => String(p.id)));
  d.seen = nowSeen;
  const list = (d.scoringOnly ? all.filter(p => p.scoring) : all);
  const shown = list.slice(0, d.shown);
  const g = d.game;
  let html = `<div class="toolbar"><span>${list.length} ${d.scoringOnly ? "scoring plays" : "plays"} · newest first</span><label class="toggle"><input type="checkbox" id="scoringOnly" ${d.scoringOnly ? "checked" : ""}> Scoring only</label></div><ul class="plays">`;
  let lastDrive = null;
  shown.forEach(p => {
    if (p.drive && p.drive !== lastDrive && !d.scoringOnly){
      lastDrive = p.drive;
      const t = p.drive.team || {};
      const logo = t.logos?.[0]?.href || t.logo || (t.id === g.home.id ? g.home.logo : t.id === g.away.id ? g.away.logo : "");
      html += `<li class="drive">${img(logo)}<div><b>${esc(t.abbreviation || t.shortDisplayName || t.displayName || "Drive")}${p.drive.live ? ` <span style="color:var(--live)">· On the field</span>` : p.drive.result ? " · " + esc(p.drive.result) : ""}</b><div class="hint" style="margin:0">${esc(p.drive.desc)}</div></div></li>`;
    }
    const isNew = prevSeen && !prevSeen.has(String(p.id));
    const sc = p.a != null && p.h != null ? `${esc(g.away.abbr)} ${p.a}<br>${esc(g.home.abbr)} ${p.h}` : "";
    html += `<li class="play${p.scoring ? " scoring" : ""}${isNew ? " new" : ""}"><div class="t">${esc(p.when)}</div><div class="x">${p.meta ? `<small>${esc(p.meta)}</small>` : ""}${esc(p.text)}</div><div class="s">${p.scoring || isNew ? sc : ""}</div></li>`;
  });
  html += `</ul>`;
  if (list.length > d.shown) html += `<button class="more" id="morePlays">Show ${Math.min(150, list.length - d.shown)} more</button>`;
  return html;
}
function teamStatsHTML(d){
  const teams = d.data?.boxscore?.teams; const g = d.game;
  if (!teams?.length || !teams.some(t => t.statistics?.length)) return `<div class="empty" style="margin-top:14px">${d.data ? "Team stats show up once the game starts." : "Loading…"}</div>`;
  const ta = teams.find(t => t.homeAway === "away" || t.team?.id === g.away.id) || teams[0];
  const th = teams.find(t => t.homeAway === "home" || t.team?.id === g.home.id) || teams[1] || {statistics:[]};
  const rows = (ta.statistics || []).map(s => {
    const o = (th.statistics || []).find(x => x.name === s.name) || {};
    const av = parseFloat(s.displayValue), hv = parseFloat(o.displayValue);
    const bars = isFinite(av) && isFinite(hv) && av + hv > 0 ? `<div class="bars"><i class="a" style="flex:${av}"></i><i class="h" style="flex:${hv}"></i></div>` : "";
    return `<div class="ts"><div class="lbl"><b>${esc(s.displayValue)}</b><span>${esc(s.label || s.name)}</span><b>${esc(o.displayValue ?? "")}</b></div>${bars}</div>`;
  }).join("");
  return `<div class="toolbar"><span style="color:var(--accent);font-weight:700">${esc(g.away.abbr)}</span><span style="color:var(--gold);font-weight:700">${esc(g.home.abbr)}</span></div><div class="tstats">${rows}</div>`;
}
function boxHTML(d){
  const players = d.data?.boxscore?.players; const g = d.game;
  if (!players?.length) return `<div class="empty" style="margin-top:14px">${d.data ? "Player stats show up once the game starts." : "Loading…"}</div>`;
  const order = [...players].sort((a, b) => (a.team?.id === g.away.id ? -1 : 1));
  return order.map(tp => {
    const t = tp.team || {};
    const groups = (tp.statistics || []).filter(s => s.athletes?.length);
    return `<div class="box-team">${img(t.logo || t.logos?.[0]?.href)}${esc(t.displayName || t.shortDisplayName || "")}</div>` + groups.map(s => {
      const labels = s.labels || [];
      const body = s.athletes.map(a => `<tr><td>${esc(a.athlete?.shortName || a.athlete?.displayName || "")}${a.athlete?.position?.abbreviation ? ` <span class="hint">${esc(a.athlete.position.abbreviation)}</span>` : ""}</td>${(a.stats || []).map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("");
      const tot = s.totals?.length ? `<tr class="tot"><td>Team</td>${s.totals.map(v => `<td>${esc(v)}</td>`).join("")}</tr>` : "";
      return `${s.name || s.text ? `<div class="box-grp">${esc(s.text || s.name)}</div>` : ""}<div class="box"><table><thead><tr><th>Player</th>${labels.map(l => `<th>${esc(l)}</th>`).join("")}</tr></thead><tbody>${body}${tot}</tbody></table></div>`;
    }).join("");
  }).join("");
}
function renderDetail(){
  const d = state.detail; if (!d) return;
  const scroll = $("sheet").scrollTop;
  const tabs = [["plays", "Play-by-play"], ["team", "Team stats"], ["box", "Box score"]];
  let body = d.tab === "plays" ? playsHTML(d) : d.tab === "team" ? teamStatsHTML(d) : boxHTML(d);
  $("detail").innerHTML = detailHeadHTML(d.game) + wpChart(d)
    + (d.err ? `<div class="err" style="margin-top:14px">${esc(d.err)}</div>` : "")
    + `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${d.tab === k}">${l}</button>`).join("")}</div>`
    + `<div id="tabBody">${body}</div>`;
  $("sheet").scrollTop = scroll;
  renderDetailHead();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const lg = e.target.closest("[data-lg]");
  if (lg){ state.league = lg.dataset.lg; savePref("lg", state.league); state.games = []; firstLoad = true; render(); loadBoard(); lg.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"}); return; }
  const f = e.target.closest("#seg [data-f]");
  if (f){ state.filter = f.dataset.f; render(); return; }
  const sf = e.target.closest("[data-setfilter]");
  if (sf){ state.filter = sf.dataset.setfilter; render(); return; }
  if (e.target.closest("#retry")){ firstLoad = true; loadBoard(); return; }
  const fav = e.target.closest("[data-fav]");
  if (fav){
    const k = fav.dataset.fav; state.fav.has(k) ? state.fav.delete(k) : state.fav.add(k); savePref("fav", [...state.fav]);
    state.games.forEach(g => g.ws = watchScore(g)); render(); renderDetail(); return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab && state.detail){ state.detail.tab = tab.dataset.tab; state.detail.shown = 150; renderDetail(); return; }
  if (e.target.closest("#morePlays") && state.detail){ state.detail.shown += 150; renderDetail(); return; }
  const card = e.target.closest("[data-id]");
  if (card && !e.target.closest("a")){ openGame(card.dataset.id); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "scoringOnly" && state.detail){ state.detail.scoringOnly = e.target.checked; state.detail.shown = 150; renderDetail(); }
});
$("back").addEventListener("click", closeGame);
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.detail) closeGame(); });
$("prevDay").addEventListener("click", () => { state.dayOffset--; state.games = []; state.prev = {}; firstLoad = true; render(); loadBoard(); });
$("nextDay").addEventListener("click", () => { state.dayOffset++; state.games = []; state.prev = {}; firstLoad = true; render(); loadBoard(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ clearTimeout(boardTimer); clearTimeout(detailTimer); }
  else { checkRollover(); loadBoard(); if (state.detail) loadDetail(); }
});
window.addEventListener("focus", checkRollover);
setInterval(() => { renderSync(); renderSlate(); checkRollover(); if (state.detail) renderDetailHead(); }, 30000);
setInterval(() => { renderSync(); if (state.detail) renderDetailHead(); }, 5000);

render();
loadBoard();
</script>
